spring.datasource.url=jdbc:h2:mem:amanafarm-${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
app.upload.dir=${java.io.tmpdir}/amanafarm-test-uploads
app.base-url=http://localhost
app.jwt.secret=integrationTestSecretKeyThatIsAtLeastSixtyFourCharactersLongForSigningTokens2026

logging.level.root=WARN
logging.level.org.springframework.boot.autoconfigure.security=ERROR
spring.main.banner-mode=off
